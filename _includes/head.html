<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css" type="text/css">

  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/favicon.png">
  <link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="apple-touch-icon-precomposed" sizes="152x152" href="{{ site.baseurl }}/apple-touch-icon.png">
  
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/atom.xml">

  {% if page.title == "Home" %}
  <script>
    (function () {
      try {
        // Same-tab revisit: skip the full-page gate; stacks come back from Cache Storage.
        if (sessionStorage.getItem("deepphdDemoReady") === "1") return;
      } catch (e) {}
      document.documentElement.classList.add("demo-booting");
    })();
  </script>
  <style>
    html.demo-booting { background: #fff; }
    html.demo-booting body { overflow: hidden; }
    html.demo-booting .nav-main,
    html.demo-booting .container { visibility: hidden !important; }
    .page-gate {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    html:not(.demo-booting) .page-gate { display: none !important; }
    .page-gate-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: min(72vw, 22rem);
    }
    .page-gate-track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(10, 59, 118, 0.15);
    }
    .page-gate-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #0A3b76;
      transition: width 0.2s linear;
    }
    .page-gate-text {
      margin: 0;
      color: #0A3b76;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }
  </style>
  {% endif %}
</head>
