<div class="gallery-player" data-gallery-player>
  <video class="gallery-video" muted autoplay loop playsinline preload="auto" poster="{{ site.baseurl }}{{ include.poster }}" src="{{ site.baseurl }}{{ include.src }}" title="{{ include.title }}"></video>
  <div class="gallery-scrub" data-scrub>
    <div class="gallery-scrub-track"></div>
    <div class="gallery-scrub-bar" data-knob></div>
  </div>
</div>
